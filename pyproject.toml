[project]
name = "chatbot-fdj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cécile Hirschauer", email = "cecile.hirschauer@bbox.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
chatbot-fdj = "chatbot_fdj:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
